name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install (locked)
        run: uv sync --frozen --extra dev

      - name: Lint — ruff
        run: uv run ruff check src tests

      - name: Lint — mypy
        run: uv run mypy src

      - name: Import smoke test
        run: |
          uv run python -c "
          from constellation_template import (
              TemplateConfig, TemplateError, TemplateConfigError,
              TemplateRuntimeError, ErrorCode,
              get_template_config, health_check, HealthResult,
              configure_logging, get_logger,
              HealthCheckable, Configurable,
              with_retry, traced,
          )
          print('import OK')
          "

      - name: Import time gate (<150ms)
        run: |
          uv run python -c "
          import time
          t = time.perf_counter()
          import constellation_template
          elapsed_ms = (time.perf_counter() - t) * 1000
          print(f'import time: {elapsed_ms:.1f}ms')
          assert elapsed_ms < 150, f'import too slow: {elapsed_ms:.1f}ms >= 150ms'
          "

      - name: Config safe-default smoke test
        run: |
          uv run python -c "
          from constellation_template import get_template_config
          c = get_template_config()
          assert c.enabled is True
          print('config defaults OK')
          "

      - name: Kill-switch smoke test
        run: |
          uv run python -c "
          from constellation_template.config import TemplateConfig
          c = TemplateConfig(enabled=False)
          assert c.enabled is False
          print('kill-switch OK')
          "

      - name: Health check smoke test
        run: |
          uv run python -c "
          from constellation_template import health_check
          r = health_check()
          assert r.status in {'ok','disabled','degraded'}
          assert r.capability == 'constellation-template'
          print(f'health OK — {r.status}')
          "

      - name: Unit tests with coverage
        run: uv run pytest tests/unit/ -q --cov=src --cov-report=term-missing --cov-fail-under=90

      - name: Integration tests
        run: uv run pytest tests/integration/ -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install (locked)
        run: uv sync --frozen --extra dev
      - name: Dependency vulnerability scan
        run: uv run pip-audit --strict
      - name: Static security analysis
        run: uv run bandit -r src -ll -q

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "constellation-template"
dynamic = ["version"]
description = "constellation-template — canonical scaffold for constellation_* packages"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "structlog>=24.0.0",
]

[project.optional-dependencies]
otel  = ["opentelemetry-api>=1.27.0"]
retry = ["tenacity>=8.2.0"]
docs  = ["mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.25.0"]
dev = [
  "bandit>=1.7.0",
  "commitizen>=3.27.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
  "mutmut>=2.4.0",
  "mypy>=1.11.0",
  "opentelemetry-api>=1.27.0",
  "pip-audit>=2.7.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "tenacity>=8.2.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/constellation_template/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/constellation_template"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit   = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
fail_under   = 90
show_missing = true

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "BLE", "EM", "S", "PLW"]
ignore  = ["S101"]

[tool.mypy]
python_version = "3.12"
strict         = true
mypy_path      = "src"
packages       = ["constellation_template"]
